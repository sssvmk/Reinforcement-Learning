# Frozen BEFORE the full policy-gradient runs (written after the validation-only learning-rate grids, before any test-year result was inspected).
primary_outcome:
  metric: test-year (2018) skill of the best-validation checkpoint, skill = (J_tso - J) / (J_tso - J_ref)
  reference: classical agent of the same objective with GBM scenarios (nvB / CVaR lambda=1 alpha=0.95 / MV kappa=8)
  business_metric: mean daily cost in EUR for the 10 MW customer, test year 2018, vs TSO-forecast purchasing
conditions:
  objectives: [neutral, cvar, meanvar]
  algorithms: [fdpg, fdpg_spsa, reinforce, a2c, dpg, trpo, ppo]
  seeds_cold: 10        # seeds 0..9, cold start (zero-initialised linear mean = buy the TSO forecast)
  seeds_warm: 5         # seeds 0..4, warm start from the least-squares-distilled newsvendor policy (secondary)
  budget_rollouts: 30000   # delivery days, identical for every algorithm; finite-difference evaluations are counted
selection:
  hyperparameters: learning rate (TRPO: KL delta) from a 3-point grid, 2 seeds (100,101), validation skill at the final iterate, neutral objective, 12000 rollouts; reused for cvar/meanvar
  checkpoint: best validation objective over training (evaluated on the Polyak-averaged policy)
  test_year_used_for_selection: false
tests:
  paired_comparison: Wilcoxon signed-rank across seeds on test skill, Holm correction within each objective
  intervals: percentile bootstrap over seeds (10,000 resamples); 7-day block bootstrap over days for business metrics
  effect_size: Cliff's delta
success_criteria:
  sample_efficiency: rollouts to reach skill >= 0.95 and >= 0.99 on validation (NaN = never reached)
  stability: worst drop in validation skill between evaluations, divergence flag (final skill < -1), sigma-collapse flag
exploratory:
  - warm-start vs cold-start
  - rho in {0, 0.5, 0.8} for classical agents only
deviations_log: see README.md
